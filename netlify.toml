# Netlify build config for the KiwinoyGamer website (Astro).
# The site lives in the `site/` subfolder of this repo; Netlify builds it in the cloud
# (no local Node needed). Connect this repo in Netlify and it picks this up automatically.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Nice URLs + security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
