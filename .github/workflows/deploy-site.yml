name: Deploy site (Netlify)

# Builds the Astro site in site/ and deploys it to the Netlify project "bosskg"
# using the Netlify CLI + an auth token — NO GitHub App / OAuth involved.
#
# One-time setup (done by you): create a Netlify personal access token
#   Netlify → avatar → User settings → Applications → Personal access tokens → New token
# then add it to this repo's Secrets as NETLIFY_AUTH_TOKEN
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret.
# The Site ID below is public (it's in Netlify's deploy-status badge URL), so it's inlined.

on:
  # rebuild a few times a day so the site pulls the newest YouTube uploads (build-time fetch)
  schedule:
    - cron: "23 */8 * * *"
  push:
    # main -> PRODUCTION (bosskg.com); staging -> a preview alias (staging--<site>.netlify.app)
    branches: [main, staging]
    paths:
      - "site/**"
      - "netlify.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

# Never run two deploys of the SAME branch at once (staging + prod are independent groups).
concurrency:
  group: deploy-site-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Refresh the Boss KG video list (longform vs Shorts) before building — best-effort:
      # if YouTube is unreachable, the previously committed site/src/data/videos.json is used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh YouTube videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install --quiet google-api-python-client google-auth requests truststore pyyaml python-dotenv || true
          python tools/site_videos.py --n 60 || echo "video refresh failed — using committed videos.json"

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy to Netlify
        working-directory: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 20342fd3-c5fd-4908-a79c-06233163ff71
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "→ PRODUCTION deploy (bosskg.com)"
            npx --yes netlify-cli@17 deploy \
              --prod \
              --dir dist \
              --functions netlify/functions \
              --site "$NETLIFY_SITE_ID" \
              --message "CI deploy: ${GITHUB_SHA::7}"
          else
            # STAGING: a stable named alias -> https://staging--<site-name>.netlify.app
            echo "→ STAGING deploy (alias: staging)"
            npx --yes netlify-cli@17 deploy \
              --alias staging \
              --dir dist \
              --functions netlify/functions \
              --site "$NETLIFY_SITE_ID" \
              --message "CI staging: ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          fi
