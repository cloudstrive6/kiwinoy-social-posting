name: Site articles (news)

# Auto-writes fresh, accurate News articles for bosskg.com from current Marvel/games
# trends (same freshness + novelty + established-facts guards as the FB trend pipeline),
# commits them, and triggers a site deploy so they go live.

on:
  schedule:
    - cron: "40 7 * * *"          # once a day (UTC); offset from the other jobs
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to generate"
        default: "3"
      auto_publish:
        description: "Auto-publish the day's top draft? true/false"
        default: "true"

concurrency:
  group: site-articles
  cancel-in-progress: false

permissions:
  contents: write
  actions: write                    # to trigger the deploy workflow

jobs:
  articles:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # so the DRAFT approval ping actually sends
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # daily auto-publish (publish_article.py --auto): Facebook/Threads/IG Story card via Post for Me,
      # and the news-card ledger on B2 for the same-story check (Bryce, 2026-11-20)
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI (article writer)
        run: npm install -g @anthropic-ai/claude-code

      - name: Install rclone (news-card ledger for the same-story check)
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Generate articles
        run: python tools/site_article.py --count "${{ github.event.inputs.count || '3' }}"

      # Push the new drafts (with their Telegram card ids) at once, so a ✅ / ❌ tap in the next
      # few minutes finds them on main (the poller checks out main; review 2026-11-21).
      - name: Push the new drafts
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ -n "$(git status --porcelain site/src/content/articles site/public/covers)" ]; then
            git add site/src/content/articles site/public/covers
            git commit -m "content: new draft articles"
            for i in 1 2 3; do git push && break; git pull --rebase --autostash || git rebase --abort; done
          fi

      # Stale drafts (dated more than 7 days ago) are rejected automatically (Bryce, 2026-11-21:
      # "Yes, auto-reject old"). Files stay in git with rejected: true; one Telegram summary.
      - name: Auto-reject drafts older than 7 days
        run: python tools/publish_article.py --expire 7 || echo "expire step failed (drafts kept)"

      # DAILY AUTO-PUBLISH (Bryce, 2026-11-20: "automatically publish a blog post daily"): the day's
      # top fresh draft goes live with no approval; the others still wait for "approved" on Telegram.
      # Its card goes to Facebook, Threads and IG Story unless the news-card track already posted
      # the same story. Skipped on a manual run that sets auto_publish to false.
      - name: Auto-publish today's top article
        if: github.event.inputs.auto_publish != 'false'
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          python tools/publish_article.py --auto || echo "auto-publish failed (drafts kept)"

      # Re-pick the hero by trend buzz + recency (features the hottest live story today).
      - name: Pick trending featured
        run: python tools/site_featured.py || echo "featured pick skipped"

      - name: Commit + deploy if anything changed
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ -n "$(git status --porcelain site/src/content/articles site/public/covers)" ]; then
            git add site/src/content/articles site/public/covers
            git commit -m "content: news update (new articles / trending featured)"
            git push
            gh workflow run deploy-site.yml || echo "deploy dispatch skipped"
          else
            echo "no article or featured change this run"
          fi
