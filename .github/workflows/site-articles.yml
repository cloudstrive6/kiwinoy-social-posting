name: Site articles (news)

# Auto-writes fresh, accurate News articles for bosskg.com from current Marvel/games
# trends (same freshness + novelty + established-facts guards as the FB trend pipeline),
# commits them, and triggers a site deploy so they go live.

on:
  schedule:
    - cron: "40 7 * * *"          # once a day (UTC); offset from the other jobs
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to generate"
        default: "3"

concurrency:
  group: site-articles
  cancel-in-progress: false

permissions:
  contents: write
  actions: write                    # to trigger the deploy workflow

jobs:
  articles:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # so the DRAFT approval ping actually sends
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate articles
        run: python tools/site_article.py --count "${{ github.event.inputs.count || '3' }}"

      # Re-pick the hero by trend buzz + recency (features the hottest live story today).
      - name: Pick trending featured
        run: python tools/site_featured.py || echo "featured pick skipped"

      - name: Commit + deploy if anything changed
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ -n "$(git status --porcelain site/src/content/articles)" ]; then
            git add site/src/content/articles
            git commit -m "content: news update (new articles / trending featured)"
            git push
            gh workflow run deploy-site.yml || echo "deploy dispatch skipped"
          else
            echo "no article or featured change this run"
          fi
