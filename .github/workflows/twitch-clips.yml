name: Twitch clips from past broadcasts

# Bryce, 2026-11-21: clips after every Twitch stream, automated, no markers. tools/twitch_clips.py
# downloads a 360p copy of each new saved broadcast to this runner (deleted with it), finds the best
# moments (loudness, speech, excited words, picture cuts, then Claude picks 5 to 8 with titles) and
# creates real Twitch clips through the official API. Clips go into the Stream Recap automatically.
# Bryce streams about 5 PM to 2 AM NZ (04:00 to 13:00 UTC); the runs after that catch each stream.

on:
  schedule:
    - cron: "25 14,18,22 * * *"
  workflow_dispatch:
    inputs:
      vod:
        description: "One broadcast id to clip (blank = every new one)"
        required: false
        default: ""
      dry:
        description: "true = print the picks, create no clips"
        required: false
        default: "false"

concurrency:
  group: twitch-clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUTF8: "1"
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --quiet -r requirements.txt "faster-whisper==1.1.1" yt-dlp
          npm install -g @anthropic-ai/claude-code

      - name: Clip new broadcasts
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.vod }}" ]; then ARGS="--vod ${{ github.event.inputs.vod }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          python tools/twitch_clips.py $ARGS

      - name: Save what was clipped
        if: always()
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ -n "$(git status --porcelain data/twitch)" ]; then
            git add data/twitch
            git commit -m "content: twitch clips state"
            git pull --rebase --autostash && git push
          fi
