name: KiwinoyGamer Trend Posts

# Marvel trend-jacking pipeline (MCU + Insomniac's Marvel games). Scouts RISING trends
# (Marvel entertainment RSS + Google-News searches + game news), the Trend Analyst ranks
# them, the Post Director writes a caption + builds a screened REAL-image news card, then
# — per config trends.autopost — AUTO-POSTS: Facebook + Threads get the post, Instagram
# gets the image as a Story, after a caption accuracy check + higher screener bar, with a
# 'went live' Telegram ping. Set trends.autopost.enabled=false for draft-only.
on:
  # Triggered by cron-job.org every 8h (0/8/16 UTC), like the other KG tracks — instead of
  # GitHub's native `schedule:` (which delays/skips under load and auto-disables after 60d).
  # cron-job.org job "KiwinoyGamer Trends (3/day, 0/8/16 UTC)" POSTs
  # {"ref":"main","inputs":{"count":"1"}} to this workflow's dispatches endpoint.
  # NOTE: do NOT re-add `schedule:` here — it would double-fire alongside cron-job.org.
  workflow_dispatch:
    inputs:
      count:
        description: "max posts this run"
        default: "1"

concurrency:
  group: kiwinoy-trends
  cancel-in-progress: false

permissions:
  contents: write         # commit the blog draft a trend spins up (trend -> blog link)

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # stunning on-topic AI scene fallback
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}    # AUTOPOST: FB + Threads + IG story
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}                    # posted-topic ledger + card storage
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # 'went live' ping / drafts
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}    # YouTube-trending source (optional; fail-open)
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Generate trend draft(s)
        run: |
          python tools/trend_post.py --count "${{ github.event.inputs.count || '1' }}"

      - name: Commit any blog draft the trend spun up
        if: always()
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ -n "$(git status --porcelain site/src/content/articles site/public/covers)" ]; then
            git add site/src/content/articles site/public/covers
            git commit -m "content: blog draft from trend auto-post"
            git push
          else
            echo "no blog draft to commit this run"
          fi
