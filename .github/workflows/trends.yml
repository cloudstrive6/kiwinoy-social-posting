name: KiwinoyGamer Trend Drafts

# Trend-jacking pipeline for the FB page. Scouts RISING gaming trends (gaming-news RSS
# + YouTube trending + Google Trends), the Trend Analyst ranks them, the Post Director
# writes an FB caption + builds a screened "trend card", and the result is delivered as
# a DRAFT to Telegram (+ stored on B2 drafts/fb-trends/). NOTHING is posted publicly —
# you review the card + caption on your phone and post to Facebook yourself.
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8h (3/day). Adjust the cadence here.
  workflow_dispatch:
    inputs:
      count:
        description: "max drafts this run"
        default: "1"

concurrency:
  group: kiwinoy-trends
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # trend-card background
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}                    # posted-topic ledger + card storage
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # deliver the draft to you
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}    # YouTube-trending source (optional; fail-open)
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Generate trend draft(s)
        run: |
          python tools/trend_post.py --count "${{ github.event.inputs.count || '1' }}"
