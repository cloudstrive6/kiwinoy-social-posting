name: KiwinoyGamer Trend Posts

# Marvel trend-jacking pipeline (MCU + Insomniac's Marvel games). Scouts RISING trends
# (Marvel entertainment RSS + Google-News searches + game news), the Trend Analyst ranks
# them, the Post Director writes a caption + builds a screened REAL-image news card, then
# — per config trends.autopost — AUTO-POSTS: Facebook + Threads get the post, Instagram
# gets the image as a Story, after a caption accuracy check + higher screener bar, with a
# 'went live' Telegram ping. Set trends.autopost.enabled=false for draft-only.
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8h (3/day). Adjust the cadence here.
  workflow_dispatch:
    inputs:
      count:
        description: "max posts this run"
        default: "1"

concurrency:
  group: kiwinoy-trends
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # (optional now — cards use real images)
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}    # AUTOPOST: FB + Threads + IG story
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}                    # posted-topic ledger + card storage
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # 'went live' ping / drafts
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}    # YouTube-trending source (optional; fail-open)
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Generate trend draft(s)
        run: |
          python tools/trend_post.py --count "${{ github.event.inputs.count || '1' }}"
