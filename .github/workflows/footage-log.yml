name: Footage log (what happens in every clip)

# 2026-11-23, Bryce: "You need to watch/analyze more the scenes and really know each of the
# videos/footage/scenes/gameplay well", and it must hold when his PC is off. Every clip in B2
# cutscenes/<game>/ and footage/<game>/ gets a scene-by-scene log (timed dialogue, frames every 2 s,
# who did what, notices, wallet changes) written by Claude on the subscription token, saved to B2
# footage-log/. Writers and tools/claims_check.py read it. Read-only on footage; never posts.

on:
  schedule:
    - cron: "41 */2 * * *"     # every 2 hours, 12 clips a run (2026-11-24: fact cards now need a log)
  workflow_dispatch:
    inputs:
      games:
        description: "space-separated game keys to log (empty = the unlocked games in reels.games_only)"
        required: false
        default: ""
      max:
        description: "clips this run"
        required: false
        default: "12"
      keys:
        description: "log exactly these B2 clip keys, separated by | (for a script's footage check)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # the run starts the next one while clips are left (2026-11-25)

concurrency:
  group: kiwinoy-footage-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GAMES: ${{ github.event.inputs.games || '' }}   # empty = unlocked games (Bryce, 2026-11-26)
      MAX: ${{ github.event.inputs.max || '12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install --quiet "faster-whisper==1.1.1"
          npm install -g @anthropic-ai/claude-code
      - name: Log clips without a log
        env:
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          if [ -n "$KEYS" ]; then python tools/footage_log.py --keys "$KEYS" --max 10
          else python tools/footage_log.py $GAMES --max "$MAX" | tee log-run.txt; fi
      # CHAIN (2026-11-25): GitHub fired the 2-hourly schedule only twice in a day, so coverage crawled
      # (fact cards need a log, and YouTube Shorts slots were skipping). While clips are left, this run
      # starts the next one (a workflow_dispatch from GITHUB_TOKEN does start a new run). It stops by
      # itself when nothing is left or a run logs nothing.
      - name: Start the next run while clips are left
        if: ${{ success() && github.event.inputs.keys == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(grep -o '[0-9]* left for the next run' log-run.txt | grep -o '^[0-9]*' || echo 0)
          done=$(grep -o 'done: [0-9]* logged' log-run.txt | grep -o '[0-9]*' || echo 0)
          echo "logged $done, left $left"
          if [ "${left:-0}" -gt 0 ] && [ "${done:-0}" -gt 0 ]; then
            gh workflow run footage-log.yml --repo "$GITHUB_REPOSITORY" -f games="$GAMES" -f max=25
          fi
