name: KiwinoyGamer IG-Draft Poller

# Lets the user TEXT the Telegram bot a command — "ig draft" / "threads draft <fmt>" /
# "fb draft <fmt>" (optionally a game and/or a length, e.g. "fb draft triptych halo 30s") to
# render a reel IN THE CLOUD into B2 drafts/<platform>/, OR "approved" / "approve <keyword>" to
# publish a drafted news article live and cross-post it to Facebook & Threads — no PC needed.
# Polls Telegram every ~15 min.
#
# SAFETY: tools/telegram_poller.py honours ONLY messages from TELEGRAM_CHAT_ID (chat-id
# gate). The actions are ig_draft.py / threads_draft.py / fb_draft.py = render + upload to a
# PRIVATE bucket + ping; they NEVER post to any platform. The cheap poll step runs every 15
# min; the heavy render deps (ffmpeg/rclone/full pip/claude-code) install ONLY on a command.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:      # manual poke for testing

concurrency:
  group: kiwinoy-ig-poller
  cancel-in-progress: false

permissions:
  contents: write         # ig_draft records the used clip; "approved" publishes an article
  actions: write          # "approved" triggers the site deploy workflow

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}  # TikTok draft -> Post-for-Me inbox flow
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}                   # read footage + upload the draft
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # read commands + ping the user
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # CHEAP poll: confirm updates, ack a command, emit fire/game/seconds. Runs every 15 min.
      - name: Check Telegram for a command
        id: check
        run: |
          pip install requests PyYAML python-dotenv truststore
          python tools/telegram_poller.py --check

      # ── "approved <article>" path: publish a draft article + cross-post (Python only, no render deps) ──
      - name: Install publish dependencies
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind == 'approve'
        run: pip install -r requirements.txt

      - name: Publish the approved article
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind == 'approve'
        env:
          ARG: ${{ steps.check.outputs.arg }}
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          if [ "$ARG" = "all" ]; then
            python tools/publish_article.py --all
          elif [ -n "$ARG" ]; then
            python tools/publish_article.py --match "$ARG"
          else
            python tools/publish_article.py
          fi

      # ── "create a blog post <topic>" path: research + draft a site article (Python only) ──
      - name: Install blog dependencies
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind == 'blog'
        run: pip install -r requirements.txt

      - name: Draft the blog article
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind == 'blog'
        env:
          ARG: ${{ steps.check.outputs.arg }}
        run: |
          git config user.name "boss-kg-bot"
          git config user.email "bot@bosskg.com"
          python tools/site_article.py --topic "$ARG"
          if [ -n "$(git status --porcelain site/src/content/articles site/public/covers)" ]; then
            git add site/src/content/articles site/public/covers
            git commit -m "content: draft blog from Telegram topic"
            git push
          else
            echo "no article written (no source / duplicate / not-new)"
          fi

      # ── draft-render path (IG / Threads / FB / TikTok): the heavy render deps ──
      - name: Install render dependencies
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind != 'approve' && steps.check.outputs.kind != 'blog'
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          curl -fsSL https://rclone.org/install.sh | sudo bash
          npm install -g @anthropic-ai/claude-code

      - name: Render the draft (IG, Threads or FB)
        if: steps.check.outputs.fire == '1' && steps.check.outputs.kind != 'approve' && steps.check.outputs.kind != 'blog'
        env:
          KIND: ${{ steps.check.outputs.kind }}
          GAME: ${{ steps.check.outputs.game }}
          SECONDS: ${{ steps.check.outputs.seconds }}
          FMT: ${{ steps.check.outputs.fmt }}
        run: |
          SEC=""
          if [ -n "$SECONDS" ] && [ "$SECONDS" != "0" ]; then SEC="--seconds $SECONDS"; fi
          if [ "$KIND" = "threads" ]; then
            echo "running: python tools/threads_draft.py --format $FMT --game $GAME $SEC"
            python tools/threads_draft.py --format "$FMT" --game "$GAME" $SEC
          elif [ "$KIND" = "fb" ]; then
            echo "running: python tools/fb_draft.py --format $FMT --game $GAME $SEC"
            python tools/fb_draft.py --format "$FMT" --game "$GAME" $SEC
          elif [ "$KIND" = "tiktok" ]; then
            echo "running: python tools/tiktok_draft.py --format $FMT --game $GAME"
            python tools/tiktok_draft.py --format "$FMT" --game "$GAME"
          else
            echo "running: python tools/ig_draft.py --game $GAME $SEC"
            python tools/ig_draft.py --game "$GAME" $SEC
          fi

      - name: Tell the user if it failed
        if: failure() && steps.check.outputs.fire == '1'
        run: |
          python -c "from core import notify; notify.telegram('⚠️ Sorry, that command hit an error. Text it again to retry, or ask me in Claude Code.')"

      - name: Upload artifacts
        if: always() && steps.check.outputs.fire == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ig-draft-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
