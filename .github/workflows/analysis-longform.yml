name: Analysis long-form (manual)

# KG long-form analysis format (Bryce 2026-11-12: manual runs for the first sample, automation
# later). Manual-only: no schedule, never uploads to YouTube or any platform. Each step leaves
# its files as a workflow artifact for review.
#   inventory: read-only list of a game's footage on B2 (sizes, durations, resolution).
#   frames: contact sheets (3 stills per clip) of cutscenes/<game>/ and footage/<game>/, the
#           source folders for analysis videos (rule, Bryce 2026-11-12).
#   transcribe: timestamped dialogue of the same clips (faster-whisper on CPU, free).
#   audition: narrator auditions (Chirp 3 HD voices on the same excerpt, -14 LUFS).
#   voice-setup: ElevenLabs credits and narrator check; deletes the voices named in "voices".
#   voice-design: voices designed and scored to match a reference voice (tools/el_voice_design.py).
#   voice-brief: narrator candidates designed from a written brief only (tools/el_voice_brief.py).
#   narrate: full narration from data/analysis/<game>/edl.json (ElevenLabs "BOSS KG Guide C"
#           for new EDLs from 2026-11-21, "BOSS KG Narrator A" before; older EDLs keep Chirp 3 HD Orus).
#   render: narration (cached) plus the full edit, QC and thumbnails; the draft goes to B2
#           renders/analysis/<game>/ (kept) with a 7-day review link. Optional "only" renders a few beats
#           as a small preview instead (test runs).
#   voice-backup-deploy: puts the Guide C reference files (B2 voice-refs/guide-c/) on the Modal Volume
#           kg-voxcpm2, deploys modal_apps/voxcpm2_narrator.py and downloads the VoxCPM2 weights (2026-11-23).
#   voice-backup-parity: the 179-word test paragraph through the Modal backup, scored against take 1.
#   claims: every narration claim about the footage judged against that footage (tools/claims_check.py,
#           Claude on the subscription; report in the artifact). narrate and render run it themselves when a
#           Guide C script has unchecked paragraphs, and stop before any credits on a false or unclear claim.
# "narrator" (narrate and render, 2026-11-23): auto (default since Bryce signed off the dry run, 2026-11-23);
#   elevenlabs stops when credits are short; voxcpm2
#   forces the VoxCPM2 Guide C clone on Modal; auto uses it for a whole video only when credits are short
#   and the video has no Guide C take yet. Backup takes live in narration-vox/, drafts end in -vox.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Step to run (inventory, frames, transcribe, audition, voice-setup, voice-design, voice-brief, voice-ab, narrate, render, voice-backup-deploy, voice-backup-parity, claims)"
        required: true
        default: "inventory"
      game:
        description: "Game key as used on B2, e.g. wolverine (frames and transcribe take a comma list)"
        required: true
        default: "wolverine"
      only:
        description: "render: comma list of beat ids for a test preview (blank = full video); frames/transcribe: only clips whose file name contains this text"
        required: false
        default: ""
      pools:
        description: "frames and transcribe: B2 pools to read (cutscenes,footage or cutscenes)"
        required: false
        default: "cutscenes,footage"
      version:
        description: "render: draft version name on B2 (e.g. v3), so earlier drafts are kept"
        required: false
        default: "v1"
      voices:
        description: "audition: space-separated Chirp 3 HD voice names (blank = Orus Enceladus Algenib); voice-setup: comma list of ElevenLabs voice names to delete"
        required: false
        default: ""
      narrator:
        description: "narrate and render: auto (default: the Modal backup only when credits are short and the video has no Guide C take or draft), elevenlabs (never the backup) or voxcpm2 (force the backup)"
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  # one queue per step and game, so a short audition does not wait behind a long transcribe
  group: kiwinoy-analysis-longform-${{ github.event.inputs.step }}-${{ github.event.inputs.game }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Footage inventory (read-only)
        if: ${{ github.event.inputs.step == 'inventory' }}
        env:
          GAME: ${{ github.event.inputs.game }}
        run: python tools/footage_inventory.py "$GAME" --probe
      - name: Contact sheets of the analysis footage (read-only)
        if: ${{ github.event.inputs.step == 'frames' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          POOLS: ${{ github.event.inputs.pools }}
          CLIP_MATCH: ${{ github.event.inputs.only }}
        run: |
          for g in ${GAME//,/ }; do python tools/footage_frames.py "$g"; done
      - name: Dialogue transcripts with faster-whisper (read-only, approved 2026-11-12)
        if: ${{ github.event.inputs.step == 'transcribe' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          POOLS: ${{ github.event.inputs.pools }}
          CLIP_MATCH: ${{ github.event.inputs.only }}
        run: |
          pip install "faster-whisper==1.1.1"
          for g in ${GAME//,/ }; do python tools/footage_transcribe.py "$g"; done
      - name: Narrator auditions (Chirp 3 HD)
        if: ${{ github.event.inputs.step == 'audition' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICES: ${{ github.event.inputs.voices }}
          AUDITION_RATE: "0.85"
        run: python tools/voice_audition.py "data/analysis/$GAME/audition.txt" ${VOICES:-Orus Enceladus Algenib}
      - name: ElevenLabs narrator voice on this account (voice-setup)
        if: ${{ github.event.inputs.step == 'voice-setup' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          EL_DELETE: ${{ github.event.inputs.voices }}
        run: python tools/el_voice_setup.py
      - name: ElevenLabs voices designed to match take 3 (voice-design)
        if: ${{ github.event.inputs.step == 'voice-design' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet resemblyzer
          python tools/el_voice_design.py
      - name: ElevenLabs guide-style narrator candidates from a brief (voice-brief, 2026-11-21)
        if: ${{ github.event.inputs.step == 'voice-brief' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/el_voice_brief.py
      - name: Blind narrator A/B, v2 against v4 (voice-ab, approved 2026-11-17)
        if: ${{ github.event.inputs.step == 'voice-ab' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          pip install --quiet "praat-parselmouth==0.4.7"
          python tools/voice_ab.py
      # Restore and save are split so a run whose render fails QC still keeps its paid narration
      # (2026-11-13: actions/cache only saved on success, so a QC fail re-recorded all of Wolverine v5).
      - name: Restore narration
        if: ${{ github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render' }}
        uses: actions/cache/restore@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/narration
          key: narration-${{ github.event.inputs.game }}-${{ hashFiles(format('data/analysis/{0}/edl.json', github.event.inputs.game)) }}
          restore-keys: narration-${{ github.event.inputs.game }}-
      # Backup takes have their own folder and cache, so they never replace paid Guide C takes. Restored
      # in every mode, so a default (elevenlabs) run sees a backup-voiced video and stops instead of
      # re-recording it. "|" cannot be in a game name, so gta6-guide never restores gta6-guide-x's cache.
      - name: Restore backup narration (VoxCPM2)
        if: ${{ github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render' }}
        uses: actions/cache/restore@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/narration-vox
          key: narration-vox|${{ github.event.inputs.game }}|none
          restore-keys: narration-vox|${{ github.event.inputs.game }}|
      - name: Narration (ElevenLabs BOSS KG voice; Chirp 3 HD for older EDLs; VoxCPM2 backup on Modal)
        if: ${{ github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          KG_NARRATOR: ${{ github.event.inputs.narrator }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if python tools/claims_check.py "$GAME" --needs; then
            # unchecked paragraphs: judge them against the footage first (2026-11-23); the gate in
            # analysis_narrate.py then stops before any credits if a footage claim is false or unclear
            npm install -g @anthropic-ai/claude-code
            pip install --quiet "faster-whisper==1.1.1"
            python tools/claims_check.py "$GAME" || true
          fi
          if [ -n "$KG_NARRATOR" ] && [ "$KG_NARRATOR" != "elevenlabs" ]; then
            # the backup's per-paragraph QC (Whisper) and its Modal client
            pip install --quiet "faster-whisper==1.1.1" "modal==1.6.4"
          fi
          python tools/analysis_narrate.py "$GAME"
      # keyed on the takes' own record, so an unchanged narration is not saved again (cache size)
      - name: Save backup narration (even if a later step fails)
        if: ${{ always() && (github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render') && hashFiles(format('output/analysis/{0}/narration-vox/timings.json', github.event.inputs.game)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/narration-vox
          key: narration-vox|${{ github.event.inputs.game }}|${{ hashFiles(format('output/analysis/{0}/narration-vox/timings.json', github.event.inputs.game)) }}
      - name: Save narration (even if a later step fails)
        if: ${{ always() && (github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render') }}
        uses: actions/cache/save@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/narration
          key: narration-${{ github.event.inputs.game }}-${{ github.run_id }}
      - name: Restore rendered beats
        if: ${{ github.event.inputs.step == 'render' && github.event.inputs.only == '' }}
        uses: actions/cache/restore@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/segs
          key: segs-${{ github.event.inputs.game }}-${{ github.run_id }}
          restore-keys: segs-${{ github.event.inputs.game }}-
      - name: Render the analysis video (draft only, never posted)
        if: ${{ github.event.inputs.step == 'render' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          ONLY: ${{ github.event.inputs.only }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # narration word times for shot anchors and the QA shot sheet (2026-11-16)
          pip install --quiet "faster-whisper==1.1.1"
          if [ -n "$ONLY" ]; then
            python tools/analysis_render.py "$GAME" --only "$ONLY" --no-upload
          else
            python tools/analysis_render.py "$GAME" --version "${VERSION:-v1}"
          fi
      - name: Save rendered beats (unchanged beats are reused next run)
        if: ${{ always() && github.event.inputs.step == 'render' && github.event.inputs.only == '' }}
        uses: actions/cache/save@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/segs
          key: segs-${{ github.event.inputs.game }}-${{ github.run_id }}
      - name: Claims check against the footage (claims, 2026-11-23)
        if: ${{ github.event.inputs.step == 'claims' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          ONLY: ${{ github.event.inputs.only }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet "faster-whisper==1.1.1"
          python tools/claims_check.py "$GAME" --only "$ONLY"
      - name: Deploy the VoxCPM2 backup narrator to Modal (voice-backup-deploy, 2026-11-23)
        if: ${{ github.event.inputs.step == 'voice-backup-deploy' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install --quiet "modal==1.6.4"
          mkdir -p refs
          python - <<'PY'
          from pathlib import Path
          from core import b2_store
          for name in ("guide-C_12s.wav", "guide-C_12s.txt", "guide-C_full.wav"):
              data = b2_store.get_bytes(f"voice-refs/guide-c/{name}")
              if not data:
                  raise SystemExit(f"B2 voice-refs/guide-c/{name} is missing")
              Path("refs", name).write_bytes(data)
              print(name, len(data), "bytes")
          PY
          modal volume create kg-voxcpm2 || true
          for f in guide-C_12s.wav guide-C_12s.txt guide-C_full.wav; do
            modal volume put --force kg-voxcpm2 "refs/$f" "/refs/$f"
          done
          rm -rf refs
          modal deploy modal_apps/voxcpm2_narrator.py
          modal run modal_apps/voxcpm2_narrator.py::warm
      - name: VoxCPM2 backup parity test (voice-backup-parity, 2026-11-23)
        if: ${{ github.event.inputs.step == 'voice-backup-parity' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install --quiet "faster-whisper==1.1.1" "modal==1.6.4"
          python tools/voice_backup.py parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ github.event.inputs.step }}-${{ github.event.inputs.game }}
          path: |
            output/inventory/
            output/analysis/
            output/voice-backup/
            !output/analysis/*/segs/
            !output/analysis/*/work/
            !output/analysis/*/*-analysis-*.mp4
            !output/analysis/*/narration/*.wav
            !output/analysis/*/narration-vox/*.wav
          retention-days: 14
