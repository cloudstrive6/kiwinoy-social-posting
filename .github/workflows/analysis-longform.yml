name: Analysis long-form (manual)

# KG long-form analysis format (Bryce 2026-11-12: manual runs for the first sample, automation
# later). Manual-only: no schedule, never uploads to YouTube or any platform. Each step leaves
# its files as a workflow artifact for review.
#   inventory: read-only list of a game's footage on B2 (sizes, durations, resolution).
#   frames: contact sheets (3 stills per clip) of cutscenes/<game>/ and footage/<game>/, the
#           source folders for analysis videos (rule, Bryce 2026-11-12).
#   transcribe: timestamped dialogue of the same clips (faster-whisper on CPU, free).
#   audition: narrator auditions (Chirp 3 HD voices on the same excerpt, -14 LUFS).
#   narrate: full narration from data/analysis/<game>/edl.json (voice Orus, picked 2026-11-12).
#   render: narration (cached) plus the full edit, QC and thumbnails; the draft goes to B2
#           renders/analysis/<game>/ (kept) with a 7-day review link. Optional "only" renders a few beats
#           as a small preview instead (test runs).
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Step to run (inventory, frames, transcribe, audition, narrate, render)"
        required: true
        default: "inventory"
      game:
        description: "Game key as used on B2, e.g. wolverine (frames and transcribe take a comma list)"
        required: true
        default: "wolverine"
      only:
        description: "render only: comma list of beat ids for a test preview (blank = full video)"
        required: false
        default: ""
      pools:
        description: "frames and transcribe: B2 pools to read (cutscenes,footage or cutscenes)"
        required: false
        default: "cutscenes,footage"
      version:
        description: "render: draft version name on B2 (e.g. v3), so earlier drafts are kept"
        required: false
        default: "v1"
      voices:
        description: "audition: space-separated Chirp 3 HD voice names (blank = Orus Enceladus Algenib)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # one queue per step and game, so a short audition does not wait behind a long transcribe
  group: kiwinoy-analysis-longform-${{ github.event.inputs.step }}-${{ github.event.inputs.game }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Footage inventory (read-only)
        if: ${{ github.event.inputs.step == 'inventory' }}
        env:
          GAME: ${{ github.event.inputs.game }}
        run: python tools/footage_inventory.py "$GAME" --probe
      - name: Contact sheets of the analysis footage (read-only)
        if: ${{ github.event.inputs.step == 'frames' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          POOLS: ${{ github.event.inputs.pools }}
        run: |
          for g in ${GAME//,/ }; do python tools/footage_frames.py "$g"; done
      - name: Dialogue transcripts with faster-whisper (read-only, approved 2026-11-12)
        if: ${{ github.event.inputs.step == 'transcribe' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          POOLS: ${{ github.event.inputs.pools }}
        run: |
          pip install "faster-whisper==1.1.1"
          for g in ${GAME//,/ }; do python tools/footage_transcribe.py "$g"; done
      - name: Narrator auditions (Chirp 3 HD)
        if: ${{ github.event.inputs.step == 'audition' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICES: ${{ github.event.inputs.voices }}
          AUDITION_RATE: "0.85"
        run: python tools/voice_audition.py "data/analysis/$GAME/audition.txt" ${VOICES:-Orus Enceladus Algenib}
      - name: Narration cache
        if: ${{ github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render' }}
        uses: actions/cache@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/narration
          key: narration-${{ github.event.inputs.game }}-${{ hashFiles(format('data/analysis/{0}/edl.json', github.event.inputs.game)) }}
          restore-keys: narration-${{ github.event.inputs.game }}-
      - name: Narration (Chirp 3 HD)
        if: ${{ github.event.inputs.step == 'narrate' || github.event.inputs.step == 'render' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python tools/analysis_narrate.py "$GAME"
      - name: Restore rendered beats
        if: ${{ github.event.inputs.step == 'render' && github.event.inputs.only == '' }}
        uses: actions/cache/restore@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/segs
          key: segs-${{ github.event.inputs.game }}-${{ github.run_id }}
          restore-keys: segs-${{ github.event.inputs.game }}-
      - name: Render the analysis video (draft only, never posted)
        if: ${{ github.event.inputs.step == 'render' }}
        env:
          GAME: ${{ github.event.inputs.game }}
          ONLY: ${{ github.event.inputs.only }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          if [ -n "$ONLY" ]; then
            python tools/analysis_render.py "$GAME" --only "$ONLY" --no-upload
          else
            python tools/analysis_render.py "$GAME" --version "${VERSION:-v1}"
          fi
      - name: Save rendered beats (unchanged beats are reused next run)
        if: ${{ always() && github.event.inputs.step == 'render' && github.event.inputs.only == '' }}
        uses: actions/cache/save@v4
        with:
          path: output/analysis/${{ github.event.inputs.game }}/segs
          key: segs-${{ github.event.inputs.game }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ github.event.inputs.step }}-${{ github.event.inputs.game }}
          path: |
            output/inventory/
            output/analysis/
            !output/analysis/*/segs/
            !output/analysis/*/work/
            !output/analysis/*/*-analysis-*.mp4
            !output/analysis/*/narration/*.wav
          retention-days: 14
