# Netlify config for the BOSS KG site. The static site is built to dist/ (deploy uses --dir dist),
# and the newsletter signup runs as a serverless function in netlify/functions/.
[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Long-term caching for fingerprinted build assets and versioned font files.
# /_astro/* names change on every content change; font filenames carry their version.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site search results are not pages to rank: keep them out of the index (header, not a meta tag,
# so the page itself stays a normal public page).
[[headers]]
  for = "/search/"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/search/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
